name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Write SSH key to file
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cloud.pem
        chmod 400 ~/.ssh/cloud.pem
        ssh-keyscan -H 13.48.104.165 >> ~/.ssh/known_hosts

    - name: Connect and deploy
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/cloud.pem ubuntu@13.48.104.165 << 'EOF'
          cd ~/clothes-crm
          git pull origin main
          docker-compose down --remove-orphans
          docker-compose up -d --build
        EOF
