name: Django CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH key from inline string
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/cloud.pem
        chmod 400 ~/.ssh/cloud.pem
        ssh-keyscan -H 13.48.104.165 >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/cloud.pem ubuntu@13.48.104.165 << 'EOF'
          cd ~/your_project_folder  # bu yerga to‘liq path yozing, masalan: cd ~/clothes-crm
          git pull origin main
          docker-compose down --remove-orphans
          docker-compose up -d --build
        EOF
