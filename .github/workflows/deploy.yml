name: Django CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cloud.pem
        chmod 600 ~/.ssh/cloud.pem
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to EC2
      run: |
        ssh -i ~/.ssh/cloud.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "
          cd ~/your_project_folder
          git pull origin main
          docker-compose down --remove-orphans
          docker-compose up -d --build
        "
